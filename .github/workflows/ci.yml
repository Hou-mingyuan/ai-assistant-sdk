name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".github/workflows/docs.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Default to read-only. Specific jobs can request `pull-requests: write` to
# post sticky comments (bundle size / coverage report).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # Needed by openapi-type-sync-guard for PR base...HEAD diffs.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-assistant-ui/package-lock.json

      - name: Check all repo scripts syntax (.mjs)
        # Matches every .mjs under scripts/ and scripts/git-hooks/. Cheap (~1s) and
        # catches typos in maintenance scripts (release, bundle-size, changelog,
        # health-check, pre-commit hook) before they break developers locally.
        run: |
          set -e
          for f in scripts/*.mjs scripts/git-hooks/*.mjs; do
            [ -f "$f" ] || continue
            echo "  - $f"
            node --check "$f"
          done

      - name: Install ai-assistant-ui dependencies
        # frontend-api-path-types.test.mjs (run by --release-check-fast) type-checks a
        # probe with `npm exec --prefix ai-assistant-ui -- tsc`. Without the UI deps
        # installed, npx silently fetches the latest TypeScript instead of the pinned
        # 5.x, whose stricter rules fail the probe. Install so the pinned tsc is used.
        run: npm ci
        working-directory: ai-assistant-ui

      - name: Run fast release checks
        # Keeps repository-wide script/OpenAPI/dependency gates in one lane while
        # the frontend job owns the heavier UI build and bundle baseline checks.
        run: node scripts/project-health-check.mjs --release-check-fast

      - name: Check OpenAPI frontend type sync
        if: github.event_name == 'pull_request'
        run: node scripts/openapi-type-sync-guard.mjs --base "origin/${{ github.base_ref }}" --head HEAD

      - name: Multi-replica config lint
        # K1: warn-only on push to main, strict on PRs targeting main so that
        # accidentally adding in-process state with replicas>1 to .env /
        # docker-compose / helm gets caught before merge.
        # Strict mode exits 1 when any high-severity finding is detected.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/multi-replica-config-lint.mjs --strict
          else
            node scripts/multi-replica-config-lint.mjs
          fi

      - name: Validate docker compose files
        env:
          AI_ASSISTANT_API_KEY: ci-placeholder
          AI_ASSISTANT_ACCESS_TOKEN: ci-token
          AI_ASSISTANT_ALLOWED_ORIGINS: https://example.com
        run: |
          docker compose config >/dev/null
          docker compose -f docker-compose.ghcr.yml config >/dev/null
          docker compose -f docker-compose.prod.yml config >/dev/null

  backend:
    name: Backend (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [21]

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn -B compile -f ai-assistant-server/pom.xml

      - name: Spotless format check
        run: mvn -B spotless:check -f ai-assistant-server/pom.xml

      - name: Test + JaCoCo coverage
        run: mvn -B test jacoco:report -f ai-assistant-server/pom.xml

      - name: Checkstyle
        run: mvn -B checkstyle:check -f ai-assistant-server/pom.xml

      - name: Coverage gate (verify)
        run: mvn -B verify -DskipTests -f ai-assistant-server/pom.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: ai-assistant-server/target/site/jacoco/
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      # Needed for the sticky bundle-size / coverage PR comment step below.
      # Reverts to contents:read when the step is skipped (push to main, etc).
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-assistant-ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ai-assistant-ui

      - name: ESLint
        run: npm run lint
        working-directory: ai-assistant-ui

      - name: Prettier format check
        run: npm run format:check
        working-directory: ai-assistant-ui

      - name: Type check + Publish Build + Release Check
        # Uses the same release lane documented for local verification. The lane
        # builds ai-assistant-ui before reading dist for bundle-size checks.
        run: node scripts/project-health-check.mjs --release-check-full

      - name: Test with coverage
        run: npm run test:coverage
        working-directory: ai-assistant-ui

      - name: Coverage regression check (vs baseline)
        # 1pt drop tolerance — catches small slides that vitest's absolute floor
        # would miss. Update baseline with:
        #   node scripts/coverage-check.mjs --update-baseline
        #   git add scripts/.coverage-baseline.json
        run: node scripts/coverage-check.mjs --max-drop-percent 1.0

      - name: Package install smoke check
        run: npm run smoke:package
        working-directory: ai-assistant-ui

      - name: Generate PR comment markdown (bundle + coverage + support dependencies)
        # 仅在 PR 上生成；push 到 main 不发评论。报表写入 .ci-reports/ 供下一步发布。
        # exit-code 0 复用即可：bundle/coverage/support report 在前面的 step 已分别做硬门槛，
        # 这里 || true 是为了即使前面失败仍能展示报表（继续上传 artifact）。
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p .ci-reports
          node scripts/bundle-size-check.mjs --markdown-out .ci-reports/bundle.md --max-delta-percent 10 || true
          node scripts/coverage-check.mjs --markdown-out .ci-reports/coverage.md --max-drop-percent 1.0 || true
          node scripts/support-dependency-report.mjs --markdown-out .ci-reports/support-dependencies.md || true
          node scripts/command-registry-report.mjs --markdown-out .ci-reports/command-registry.md || true
          node scripts/ci-metrics-comment.mjs \
            --bundle .ci-reports/bundle.md \
            --coverage .ci-reports/coverage.md \
            --support-dependencies .ci-reports/support-dependencies.md \
            --command-registry .ci-reports/command-registry.md \
            --out .ci-reports/combined.md \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --run-number "${{ github.run_number }}"

      - name: Post / update sticky PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.ci-reports/combined.md', 'utf-8');
            const marker = '<!-- ci-metrics-sticky -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated sticky comment ${existing.id}.`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
              core.info('Created sticky comment.');
            }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: ai-assistant-ui/coverage/
          retention-days: 14

      - name: Upload CI metric reports
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ci-metric-reports
          path: .ci-reports/
          retention-days: 14

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21 for the real Starter backend
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ai-assistant-ui/package-lock.json
            e2e/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: ai-assistant-ui

      - name: Build UI package for playground
        run: npm run build:lib
        working-directory: ai-assistant-ui

      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run E2E tests
        run: npm test
        working-directory: e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  security:
    name: Security scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ai-assistant-ui/package-lock.json
            ai-assistant-vue-playground/package-lock.json
            docs/package-lock.json
            e2e/package-lock.json

      - name: Build Redis-capable backend artifact for transitive dependency scanning
        run: mvn -B -pl ai-assistant-service -am -DskipTests -Predis package

      - name: Cache OWASP Dependency-Check data
        id: owasp-cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('ai-assistant-server/pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: OWASP Dependency-Check (backend, refresh with NVD key)
        if: env.NVD_API_KEY != ''
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -f ai-assistant-server/pom.xml \
            -DfailBuildOnCVSS=9 \
            -DsuppressionFiles=.github/owasp-suppressions.xml \
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY

      - name: OWASP Dependency-Check (backend, cached database)
        if: env.NVD_API_KEY == '' && steps.owasp-cache.outputs.cache-hit == 'true'
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -f ai-assistant-server/pom.xml \
            -DfailBuildOnCVSS=9 \
            -DsuppressionFiles=.github/owasp-suppressions.xml \
            -DautoUpdate=false

      - name: Explain OWASP fallback when no NVD database is available
        if: env.NVD_API_KEY == '' && steps.owasp-cache.outputs.cache-hit != 'true'
        run: |
          echo "::notice::NVD_API_KEY and a reusable Dependency-Check database are unavailable; the built service artifact remains gated by Trivy below."

      - name: npm audit (frontend workspaces)
        run: |
          for workspace in ai-assistant-ui ai-assistant-vue-playground docs e2e; do
            echo "::group::npm audit ${workspace}"
            npm --prefix "${workspace}" audit --audit-level=high
            echo "::endgroup::"
          done

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            ai-assistant-server/target/dependency-check-report.*
          if-no-files-found: ignore
          retention-days: 14

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Build documentation site
        run: npm run build
        working-directory: docs

  playground:
    name: Playground unit tests
    runs-on: ubuntu-latest
    needs: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ai-assistant-ui/package-lock.json
            ai-assistant-vue-playground/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: ai-assistant-ui

      - name: Build UI library for Playground
        run: npm run build:lib
        working-directory: ai-assistant-ui

      - name: Install Playground dependencies
        run: npm ci
        working-directory: ai-assistant-vue-playground

      - name: Run Playground Vitest
        run: npm test
        working-directory: ai-assistant-vue-playground

  compose-smoke:
    name: Docker Compose zero-key smoke
    runs-on: ubuntu-latest
    needs: [backend, repository]

    steps:
      - uses: actions/checkout@v6

      - name: Prepare env
        run: |
          cp .env.example .env
          sed -i 's/^AI_ASSISTANT_API_KEY=.*/AI_ASSISTANT_API_KEY=/' .env

      - name: Build and start standalone service
        run: docker compose up -d --build

      - name: Wait for health
        run: |
          for i in $(seq 1 36); do
            if curl -sf http://localhost:8080/ai-assistant/health; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs ai-assistant
          exit 1

      - name: Zero-key smoke (scripts/smoke-zero-key.mjs)
        run: node scripts/smoke-zero-key.mjs http://localhost:8080/ai-assistant

      - name: Tear down
        if: always()
        run: docker compose down -v
