# Major bumps are ignored on purpose. Every dependency PR that went stale in
# this repo was an ungrouped major upgrade (Spring Boot 3->4, ESLint 9->10,
# TypeScript 5->6, JUnit 5->6, ...); each needs deliberate migration work, so
# they are raised by hand rather than left to rot as open PRs. Grouped
# minor/patch updates are merged automatically once CI is green — see
# .github/workflows/dependabot-auto-merge.yml
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # Both images encode the JDK in the tag, so Dependabot reads
      # maven:3.9.11-eclipse-temurin-21 -> 3.9.15-eclipse-temurin-26 as a patch
      # bump and hides a 21 -> 26 jump inside it. Lombok's processor does not
      # run on 26, which drops every generated accessor and breaks the build.
      # The JDK baseline moves by hand, across Dockerfile and CI together.
      - dependency-name: maven
      - dependency-name: eclipse-temurin
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: maven
    directory: /ai-assistant-server
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      maven-server-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: maven
    directory: /ai-assistant-service
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      maven-service-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: maven
    directory: /ai-assistant-client
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      maven-client-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /ai-assistant-ui
    schedule:
      interval: weekly
      day: monday
      time: "10:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      npm-ui-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      npm-docs-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
