server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress hashed frontend assets. SSE keeps its own `gzip off` override
    # below so event chunks are still flushed immediately.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:" always;

    location ~* \.(?:css|js|mjs|svg|woff2?)$ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    # 静态资源 + SPA 回退（playground 是单页应用）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 把助手接口反代到同一 compose 网络里的后端服务（服务名 ai-assistant）
    # 路径与后端 AI_ASSISTANT_CONTEXT_PATH=/ai-assistant 对齐
    location /ai-assistant/ {
        proxy_pass http://ai-assistant:8080/ai-assistant/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Do not let the upstream gzip SSE frames; compression can hold small
        # events until a buffer fills and turn a stream into a delayed burst.
        proxy_set_header Accept-Encoding "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 流式（SSE）聊天必须关闭缓冲，否则回复不会逐字吐出
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    # Playground smoke 只需 Spring Boot 的健康探针，不代理其他管理端点。
    location /actuator/health/ {
        proxy_pass http://ai-assistant:8080/actuator/health/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
    }
}
