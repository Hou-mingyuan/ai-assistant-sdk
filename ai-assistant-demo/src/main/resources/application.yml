server:
  port: 8080
  shutdown: graceful

spring:
  lifecycle:
    # headless 首装 Chromium 或长页面抓取时，请求可能超过 30s；避免优雅停机被硬性打断
    timeout-per-shutdown-phase: 120s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

ai-assistant:
  # The deterministic demo provider keeps this example safe and zero-key by default.
  # For live AI, override provider/api-key/base-url/model with environment variables.
  provider: ${AI_ASSISTANT_PROVIDER:demo}
  api-key: ${AI_ASSISTANT_API_KEY:}
  base-url: ${AI_ASSISTANT_BASE_URL:}
  model: ${AI_ASSISTANT_MODEL:}
  context-path: /ai-assistant
  headless-fetch-enabled: false
  websocket-enabled: false
  admin-enabled: false
  connector-management-enabled: false
  mcp-server-enabled: false
  rag-enabled: false
  allowed-origins: ${AI_ASSISTANT_ALLOWED_ORIGINS:*}
  access-token: ${AI_ASSISTANT_ACCESS_TOKEN:}
  rate-limit: 60

logging:
  level:
    com.aiassistant: INFO
